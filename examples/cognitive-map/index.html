<style>

       background:var(--bg);color:var(--fg);display:flex;height:100vh;overflow:hidden}
  aside{width:340px;flex:none;background:var(--panel);border-right:1px solid var(--line);
        display:flex;flex-direction:column;overflow:hidden}
  aside h1{font-size:16px;margin:0;padding:16px 18px 4px}
  .sub{padding:0 18px 12px;color:var(--dim);font-size:12px}
  .search{padding:0 14px 10px}
  .search input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);
        background:#0d1017;color:var(--fg);font-size:13px}
  .list{flex:1;overflow-y:auto;padding:0 8px 16px}
  .grp{color:var(--dim);font-size:11px;letter-spacing:.08em;padding:12px 10px 6px}
  .item{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;
        cursor:pointer;font-size:13px}
  .item:hover{background:#1f2430}
  .item.sel{background:#243049;outline:1px solid #3b82f6}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .item .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .num{color:var(--dim);font-size:11px}
  main{flex:1;position:relative;overflow:hidden}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg.grabbing{cursor:grabbing}
  .edge{stroke:#3a4152;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
  .edge.on{stroke:#ffd43b;stroke-width:2.6;marker-end:url(#arrow-hi)}
  .edge.faded{opacity:.12}
  .elen{fill:var(--dim);font-size:9px;pointer-events:none}
  .node circle{stroke:#0f1117;stroke-width:2}
  .node text{fill:var(--fg);font-size:11px;paint-order:stroke;
             stroke:#0f1117;stroke-width:3px;stroke-linejoin:round}
  .node{cursor:pointer}
  .node.faded{opacity:.12}
  .node.sel circle{stroke:#ffd43b;stroke-width:3.5}
  .node.hi circle{stroke:#ffd43b;stroke-width:2.6}
  .legend{position:absolute;left:14px;bottom:14px;background:rgba(23,26,35,.92);
          border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12px}
  .legend div{display:flex;align-items:center;gap:7px;padding:2px 0}
  .panel{position:absolute;top:14px;right:14px;width:300px;max-height:calc(100% - 28px);
         overflow-y:auto;background:rgba(23,26,35,.96);border:1px solid var(--line);
         border-radius:12px;padding:14px 16px;font-size:13px}
  .panel h2{margin:0 0 4px;font-size:15px}
  .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;color:#fff}
  .kv{margin:10px 0 0}
  .kv .k{color:var(--dim);font-size:11px;letter-spacing:.06em;margin-bottom:3px}
  .kv .row{padding:4px 0;border-bottom:1px dashed #262b36}
  .kv .row:last-child{border-bottom:none}
  .q{padding:5px 8px;margin:4px 0;border-radius:6px;background:#1d2230;cursor:pointer;font-size:12px}
  .q:hover{background:#26304a}
  .empty{color:var(--dim)}
  code{background:#0d1017;padding:1px 5px;border-radius:4px;font-size:12px}
</style>
</head>

const nodes = DATA.nodes.map(n=>Object.assign({},n.data));
const edges = DATA.edges.map(e=>Object.assign({},e.data));
const byId = {}; nodes.forEach(n=>byId[n.id]=n);

// ---- 按 kind 分层布局：6 列 × 每列纵向铺开 ----
const colX = {}; ORDER.forEach((k,i)=>colX[k]= 90 + i*175);
const groups = {}; ORDER.forEach(k=>groups[k]=[]);
nodes.forEach(n=>groups[n.kind].push(n));
const H = Math.max(...ORDER.map(k=>groups[k].length))*78 + 80;
ORDER.forEach(k=>{
  const arr = groups[k];
  arr.forEach((n,i)=>{
    n.x = colX[k];
    n.y = (H - arr.length*78)/2 + i*78 + 40;
  });
});

// 手工微调：让 trigger 层与其 emotion 目标对齐更自然（按 evokes 顺序排）
const ev = {}; edges.filter(e=>e.kind==='evokes').forEach(e=>{ (ev[e.target]=ev[e.target]||[]).push(e.source); });

const svg = document.getElementById('svg'), vp = document.getElementById('viewport');
document.getElementById('viewport').parentElement.style.height = H+'px';

function edgePath(a,b){
  const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
  const r=16, sx=a.x+dx/d*r, sy=a.y+dy/d*r, tx=b.x-dx/d*(r+6), ty=b.y-dy/d*(r+6);
  const mx=(sx+tx)/2, my=(sy+ty)/2 - Math.abs(dy)*0.12;
  return {d:`M${sx},${sy} Q${mx},${my} ${tx},${ty}`, mx, my};
}

function render(){
  const eg = document.getElementById('edges'), ng = document.getElementById('nodes');
  eg.innerHTML=''; ng.innerHTML='';
  edges.forEach(e=>{
    const a=byId[e.source], b=byId[e.target]; if(!a||!b) return;
    const p=edgePath(a,b);
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',p.d); path.setAttribute('class','edge'); path.dataset.id=e.id;
    eg.appendChild(path); e._el=path;
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',p.mx); t.setAttribute('y',p.my-3); t.setAttribute('text-anchor','middle');
    t.setAttribute('class','elen'); t.textContent=e.kind; eg.appendChild(t); e._lab=t;
  });
  nodes.forEach(n=>{
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','node'); g.dataset.id=n.id;
    g.setAttribute('transform',`translate(${n.x},${n.y})`);
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r',13); c.setAttribute('fill',n.color||COL[n.kind]||'#888');
    const label = n.id.length>9 ? n.id.slice(0,8)+'…' : n.id;
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('y',27); t.setAttribute('text-anchor','middle'); t.textContent=label;
    g.appendChild(c); g.appendChild(t); ng.appendChild(g);
    g.addEventListener('click',()=>select(n.id));
    n._el=g;
  });
}
render();

// ---- 缩放平移 ----
let vb = {x:0,y:0,w:1100,h:H};
function apply(){ svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }
svg.setAttribute('viewBox',`0 0 1100 ${H}`); vb={x:0,y:0,w:1100,h:H};
svg.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const rect=svg.getBoundingClientRect();
  const mx=vb.x + (ev.clientX-rect.left)/rect.width*vb.w;
  const my=vb.y + (ev.clientY-rect.top)/rect.height*vb.h;
  const f = ev.deltaY<0 ? 0.9 : 1.1;
  vb.w*=f; vb.h*=f;
  vb.x = mx-(mx-vb.x)*f; vb.y = my-(my-vb.y)*f;
  apply();
},{passive:false});
let drag=null;
svg.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};svg.classList.add('grabbing')});
window.addEventListener('mousemove',e=>{
  if(!drag) return;
  const rect=svg.getBoundingClientRect();
  vb.x = drag.vx-(e.clientX-drag.x)/rect.width*vb.w;
  vb.y = drag.vy-(e.clientY-drag.y)/rect.height*vb.h;
  apply();
});
window.addEventListener('mouseup',()=>{drag=null;svg.classList.remove('grabbing')});

// ---- 侧栏列表 ----
function buildList(filter=''){
  const box=document.getElementById('list'); box.innerHTML='';
  ORDER.forEach(k=>{
    const items = groups[k].filter(n=>!filter||n.id.includes(filter));
    if(!items.length) return;
    const h=document.createElement('div'); h.className='grp';
    h.textContent=`${KIND_CN[k]} ${k} · ${items.length}`; box.appendChild(h);
    items.forEach(n=>{
      const d=document.createElement('div'); d.className='item'; d.dataset.id=n.id;
      const dot=document.createElement('div'); dot.className='dot'; dot.style.background=COL[k]||'#888';
      const nm=document.createElement('div'); nm.className='nm'; nm.textContent=n.id;
      const num=document.createElement('div'); num.className='num';
      const o=edges.filter(e=>e.source===n.id).length, i=edges.filter(e=>e.target===n.id).length;
      num.textContent = (o||i) ? `${o}→ ${i}←` : '孤立';
      d.appendChild(dot); d.appendChild(nm); d.appendChild(num);
      d.addEventListener('click',()=>select(n.id));
      box.appendChild(d);
    });
  });
  if(!box.children.length) box.innerHTML='<div class="empty" style="padding:12px">无匹配对象</div>';
}
buildList();
document.getElementById('q').addEventListener('input',e=>buildList(e.target.value.trim()));
document.getElementById('meta').textContent =
  `${DATA.meta.title} · ${nodes.length} 对象 / ${edges.length} 关系 · ${DATA.meta.source||''}`;
document.getElementById('legend').innerHTML = ORDER.map(k=>
  `<div><span class="dot" style="background:${COL[k]}"></span>${KIND_CN[k]} <span style="color:#8b93a7">×${DATA.kinds[k]||0}</span></div>`).join('');

// ---- 选择与推理展示 ----
function select(id){
  const n=byId[id]; if(!n) return;
  nodes.forEach(x=>{x._el.classList.remove('sel'); x._el.classList.remove('hi');});
  edges.forEach(e=>{e._el.classList.remove('on'); e._el.classList.remove('faded'); e._lab.classList.remove('on');});
  n._el.classList.add('sel');
  document.querySelectorAll('.item').forEach(el=>el.classList.toggle('sel',el.dataset.id===id));

  const outs=edges.filter(e=>e.source===id), ins=edges.filter(e=>e.target===id);
  outs.forEach(e=>{e._el.classList.add('on'); e._lab.style.fill='#ffd43b'; const t=byId[e.target]; if(t)t._el.classList.add('hi')});
  ins.forEach(e=>{e._el.classList.add('on'); e._lab.style.fill='#ffd43b'; const s=byId[e.source]; if(s)s._el.classList.add('hi')});
  edges.forEach(e=>{ if(!outs.includes(e)&&!ins.includes(e)){e._el.classList.add('faded'); e._lab.style.opacity=0.15;}});
  edges.forEach(e=>{ if(outs.includes(e)||ins.includes(e)) e._lab.style.opacity=1;});

  const qs = [
    `cmap out "${id}"`,
    `cmap in "${id}"`,
    `cmap chain "${id}"`,
  ];
  const p=document.getElementById('panel');
  p.innerHTML = `<h2>${id}</h2>
    <span class="tag" style="background:${COL[n.kind]}">${KIND_CN[n.kind]} · ${n.kind}</span>
    ${n.group?`<span class="tag" style="background:#495057;margin-left:6px">${n.group}</span>`:''}
    ${n.note?`<div class="empty" style="margin-top:8px">注：${n.note}</div>`:''}
    <div class="empty" style="margin-top:6px">源文件 ${n.file}</div>
    <div class="kv"><div class="k">正向 out（${outs.length}）</div>
      ${outs.length?outs.map(e=>`<div class="row">-${e.kind}→ <b>${e.target}</b></div>`).join(''):'<div class="empty">（无出边）</div>'}</div>
    <div class="kv"><div class="k">反向 in（${ins.length}）</div>
      ${ins.length?ins.map(e=>`<div class="row"><b>${e.source}</b> -${e.kind}→</div>`).join(''):'<div class="empty">（无入边）</div>'}</div>
    <div class="kv"><div class="k">试运行</div><div id="trybox"></div></div>`;
  const tb = p.querySelector('#trybox');
  qs.forEach(q=>{
    const b=document.createElement('div'); b.className='q'; b.textContent=q;
    b.addEventListener('click',()=>{ if(typeof sendPrompt==='function') sendPrompt(q); });
    tb.appendChild(b);
  });
}
</script>
</body>
</html>
