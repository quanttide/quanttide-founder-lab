[package]
name = "qtfounder-cli-lab"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "qtfounder-lab"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
